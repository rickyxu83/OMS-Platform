<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="180x180" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <title>OMS Platform 运维智管</title>
    <meta name="description" content="OMS Platform 运维智管统一登录入口与管理工作台" />
    <style>
      @media (hover: none), (pointer: coarse) {
        html,
        body,
        #root {
          min-height: 100%;
          background: #f7f1ea;
        }

        body {
          margin: 0;
        }

        #root:empty {
          position: fixed;
          inset: 0;
          overflow: hidden;
          background:
            radial-gradient(circle at 50% 43%, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04) 28%, transparent 42%),
            linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.18)),
            #f7f1ea;
        }

        #root:empty::before {
          content: "";
          position: absolute;
          inset: -14vh -14vw;
          background:
            radial-gradient(circle at 50% 45%, rgba(124, 58, 237, 0.34), transparent 31%),
            radial-gradient(circle at 41% 34%, rgba(244, 63, 94, 0.30), transparent 24%),
            radial-gradient(circle at 59% 58%, rgba(14, 165, 233, 0.28), transparent 26%),
            radial-gradient(circle at 30% 63%, rgba(249, 115, 22, 0.24), transparent 29%),
            radial-gradient(circle at 74% 30%, rgba(16, 185, 129, 0.26), transparent 27%),
            radial-gradient(circle at 18% 18%, rgba(236, 72, 153, 0.22), transparent 24%),
            radial-gradient(circle at 84% 80%, rgba(37, 99, 235, 0.22), transparent 28%);
          filter: blur(34px);
          opacity: 0.95;
          transform: translate3d(0, 0, 0);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
